services:
  - type: web
    name: dfir-ai-poc
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: AI_PROVIDER
        value: gemini

      - key: GEMINI_MODEL
        value: gemini-3.8-flash

      - key: GEMINI_API_KEY
        sync: false

      - key: DFIR_CASE_ID
        value: CASE-001
